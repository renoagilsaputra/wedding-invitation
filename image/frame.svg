<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420">

  <!-- ── Oval double border ──────────────────────────────────── -->
  <ellipse cx="180" cy="210" rx="116" ry="148"
           fill="none" stroke="#c9a060" stroke-width="2"/>
  <ellipse cx="180" cy="210" rx="109" ry="141"
           fill="none" stroke="#c9a060" stroke-width="0.8"/>

  <!-- ════════════════════════════════════════════════════════════
       TOP-RIGHT LILY CLUSTER
  ════════════════════════════════════════════════════════════ -->
  <g transform="translate(296,60)">

    <!-- Main open lily (6 tepals, rotated -30°) -->
    <g transform="rotate(-30)">
      <path d="M0,0 C-9,-18 -8,-38 0,-52 C8,-38 9,-18 0,0" fill="#c9a060"/>
      <path d="M0,0 C-9,-18 -8,-38 0,-52 C8,-38 9,-18 0,0" fill="#c9a060" transform="rotate(60)"/>
      <path d="M0,0 C-9,-18 -8,-38 0,-52 C8,-38 9,-18 0,0" fill="#c9a060" transform="rotate(120)"/>
      <path d="M0,0 C-9,-18 -8,-38 0,-52 C8,-38 9,-18 0,0" fill="#c9a060" transform="rotate(180)"/>
      <path d="M0,0 C-9,-18 -8,-38 0,-52 C8,-38 9,-18 0,0" fill="#c9a060" transform="rotate(240)"/>
      <path d="M0,0 C-9,-18 -8,-38 0,-52 C8,-38 9,-18 0,0" fill="#c9a060" transform="rotate(300)"/>
      <!-- Petal mid-veins -->
      <path d="M0,-4 L0,-44" stroke="#a08432" stroke-width="0.6" opacity="0.5"/>
      <path d="M0,-4 L0,-44" stroke="#a08432" stroke-width="0.6" opacity="0.5" transform="rotate(60)"/>
      <path d="M0,-4 L0,-44" stroke="#a08432" stroke-width="0.6" opacity="0.5" transform="rotate(120)"/>
      <!-- Stamens -->
      <line x1="0" y1="-3" x2="-9" y2="-31" stroke="#a08432" stroke-width="0.9"/>
      <line x1="0" y1="-3" x2="-4" y2="-33" stroke="#a08432" stroke-width="0.9"/>
      <line x1="0" y1="-3" x2=" 0" y2="-34" stroke="#a08432" stroke-width="0.9"/>
      <line x1="0" y1="-3" x2=" 4" y2="-33" stroke="#a08432" stroke-width="0.9"/>
      <line x1="0" y1="-3" x2=" 9" y2="-31" stroke="#a08432" stroke-width="0.9"/>
      <circle cx="-9" cy="-31" r="2"   fill="#a08432"/>
      <circle cx="-4" cy="-33" r="2"   fill="#a08432"/>
      <circle cx=" 0" cy="-34" r="2"   fill="#a08432"/>
      <circle cx=" 4" cy="-33" r="2"   fill="#a08432"/>
      <circle cx=" 9" cy="-31" r="2"   fill="#a08432"/>
      <!-- Center -->
      <circle r="5.5" fill="#c9a060"/>
      <circle r="2.5" fill="#fff8ee"/>
    </g>

    <!-- Stem curving toward bottom-left -->
    <path d="M2,10 C-8,30 -22,62 -36,92 C-50,120 -62,152 -65,182"
          stroke="#8a7030" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Leaf 1 -->
    <path d="M-18,56 C-5,42 10,36 10,22 C-2,30 -10,44 -18,56Z"
          fill="#8a7030" opacity="0.85"/>
    <!-- Leaf 2 -->
    <path d="M-44,116 C-27,100 -10,93 -8,77 C-20,85 -32,101 -44,116Z"
          fill="#8a7030" opacity="0.85"/>

    <!-- Half-open bud (top, small) -->
    <g transform="translate(-6,28) rotate(-15)">
      <path d="M0,0 C-5,-10 -5,-26 0,-36 C5,-26 5,-10 0,0" fill="#c9a060" opacity="0.95"/>
      <path d="M0,0 C-5,-10 -5,-26 0,-36 C5,-26 5,-10 0,0" fill="#c9a060" opacity="0.85" transform="rotate(115)"/>
      <path d="M0,0 C-5,-10 -5,-26 0,-36 C5,-26 5,-10 0,0" fill="#c9a060" opacity="0.85" transform="rotate(245)"/>
      <line x1="0" y1="-2" x2="-4" y2="-22" stroke="#a08432" stroke-width="0.8"/>
      <line x1="0" y1="-2" x2=" 4" y2="-22" stroke="#a08432" stroke-width="0.8"/>
      <circle cx="-4" cy="-22" r="1.5" fill="#a08432"/>
      <circle cx=" 4" cy="-22" r="1.5" fill="#a08432"/>
      <circle r="3" fill="#c9a060"/>
      <circle r="1.4" fill="#fff8ee"/>
    </g>

    <!-- Small leaf near bud -->
    <path d="M-4,18 C 6,10 14,8 12,2 C4,6 -2,12 -4,18Z"
          fill="#8a7030" opacity="0.8"/>
  </g>


  <!-- ════════════════════════════════════════════════════════════
       BOTTOM-LEFT LILY CLUSTER
  ════════════════════════════════════════════════════════════ -->
  <g transform="translate(64,360)">

    <!-- Main open lily (6 tepals, rotated 150° — facing opposite direction) -->
    <g transform="rotate(150)">
      <path d="M0,0 C-9,-18 -8,-38 0,-52 C8,-38 9,-18 0,0" fill="#c9a060"/>
      <path d="M0,0 C-9,-18 -8,-38 0,-52 C8,-38 9,-18 0,0" fill="#c9a060" transform="rotate(60)"/>
      <path d="M0,0 C-9,-18 -8,-38 0,-52 C8,-38 9,-18 0,0" fill="#c9a060" transform="rotate(120)"/>
      <path d="M0,0 C-9,-18 -8,-38 0,-52 C8,-38 9,-18 0,0" fill="#c9a060" transform="rotate(180)"/>
      <path d="M0,0 C-9,-18 -8,-38 0,-52 C8,-38 9,-18 0,0" fill="#c9a060" transform="rotate(240)"/>
      <path d="M0,0 C-9,-18 -8,-38 0,-52 C8,-38 9,-18 0,0" fill="#c9a060" transform="rotate(300)"/>
      <path d="M0,-4 L0,-44" stroke="#a08432" stroke-width="0.6" opacity="0.5"/>
      <path d="M0,-4 L0,-44" stroke="#a08432" stroke-width="0.6" opacity="0.5" transform="rotate(60)"/>
      <path d="M0,-4 L0,-44" stroke="#a08432" stroke-width="0.6" opacity="0.5" transform="rotate(120)"/>
      <line x1="0" y1="-3" x2="-9" y2="-31" stroke="#a08432" stroke-width="0.9"/>
      <line x1="0" y1="-3" x2="-4" y2="-33" stroke="#a08432" stroke-width="0.9"/>
      <line x1="0" y1="-3" x2=" 0" y2="-34" stroke="#a08432" stroke-width="0.9"/>
      <line x1="0" y1="-3" x2=" 4" y2="-33" stroke="#a08432" stroke-width="0.9"/>
      <line x1="0" y1="-3" x2=" 9" y2="-31" stroke="#a08432" stroke-width="0.9"/>
      <circle cx="-9" cy="-31" r="2"   fill="#a08432"/>
      <circle cx="-4" cy="-33" r="2"   fill="#a08432"/>
      <circle cx=" 0" cy="-34" r="2"   fill="#a08432"/>
      <circle cx=" 4" cy="-33" r="2"   fill="#a08432"/>
      <circle cx=" 9" cy="-31" r="2"   fill="#a08432"/>
      <circle r="5.5" fill="#c9a060"/>
      <circle r="2.5" fill="#fff8ee"/>
    </g>

    <!-- Stem curving toward top-right -->
    <path d="M-2,10 C 8,30 22,62 36,92 C50,120 62,152 65,182"
          stroke="#8a7030" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Leaf 1 -->
    <path d="M18,56 C 5,42 -10,36 -10,22 C2,30 10,44 18,56Z"
          fill="#8a7030" opacity="0.85"/>
    <!-- Leaf 2 -->
    <path d="M44,116 C 27,100 10,93 8,77 C20,85 32,101 44,116Z"
          fill="#8a7030" opacity="0.85"/>

    <!-- Half-open bud -->
    <g transform="translate(6,28) rotate(15)">
      <path d="M0,0 C-5,-10 -5,-26 0,-36 C5,-26 5,-10 0,0" fill="#c9a060" opacity="0.95"/>
      <path d="M0,0 C-5,-10 -5,-26 0,-36 C5,-26 5,-10 0,0" fill="#c9a060" opacity="0.85" transform="rotate(115)"/>
      <path d="M0,0 C-5,-10 -5,-26 0,-36 C5,-26 5,-10 0,0" fill="#c9a060" opacity="0.85" transform="rotate(245)"/>
      <line x1="0" y1="-2" x2="-4" y2="-22" stroke="#a08432" stroke-width="0.8"/>
      <line x1="0" y1="-2" x2=" 4" y2="-22" stroke="#a08432" stroke-width="0.8"/>
      <circle cx="-4" cy="-22" r="1.5" fill="#a08432"/>
      <circle cx=" 4" cy="-22" r="1.5" fill="#a08432"/>
      <circle r="3" fill="#c9a060"/>
      <circle r="1.4" fill="#fff8ee"/>
    </g>

    <!-- Small leaf near bud -->
    <path d="M4,18 C -6,10 -14,8 -12,2 C-4,6 2,12 4,18Z"
          fill="#8a7030" opacity="0.8"/>
  </g>

</svg>
